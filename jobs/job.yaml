resources:
  jobs:
    cinedata_etl_pipeline:
      name: cinedata_etl_pipeline
      email_notifications:
        on_failure:
          - ama3@cesar.school
      schedule:
        quartz_cron_expression: 59 0 5 * * ?
        timezone_id: America/Sao_Paulo
        pause_status: UNPAUSED
      tasks:
        - task_key: to_Bronze
          notebook_task:
            notebook_path: /Workspace/Users/ama3@cesar.school/cinedata_analytics/notebooks/Landing_to_Bronze
            source: WORKSPACE
        - task_key: to_Silver
          depends_on:
            - task_key: to_Bronze
          notebook_task:
            notebook_path: /Workspace/Users/ama3@cesar.school/cinedata_analytics/notebooks/Bronze_to_Silver
            source: WORKSPACE
        - task_key: to_Gold
          depends_on:
            - task_key: to_Silver
          notebook_task:
            notebook_path: /Workspace/Users/ama3@cesar.school/cinedata_analytics/notebooks/Silver_to_Gold
            source: WORKSPACE
      queue:
        enabled: true
      performance_target: PERFORMANCE_OPTIMIZED
